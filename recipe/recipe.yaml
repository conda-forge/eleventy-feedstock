context:
  version: "3.1.8"

package:
  name: eleventy
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@11ty/eleventy/-/eleventy-${{ version }}.tgz
  sha256: c818a912a1fa65ec2337ac5bbc43dc6dfb657e343f98a1d6f227fd5c6cf7a8ba

build:
  number: 0
  noarch: generic

requirements:
  build:
    - jq
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - script:
      - eleventy --help

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: A simpler site generator. Transforms a directory of templates (of varying types) into HTML.
  homepage: https://github.com/11ty/eleventy
  repository: https://github.com/11ty/eleventy

extra:
  recipe-maintainers:
    - danielnachun
